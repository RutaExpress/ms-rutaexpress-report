server:
  port: ${PORT:8086}

spring:
  application:
    name: ms-rutaexpress-report
  # Oracle: usuario REPORT_USER en ORCLPDB1 (lo crea apps/oracle/01-usuarios.sh de rutaexpress-infra)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/ORCLPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:REPORT_USER}
    # secreto: sin valor por defecto (convención); va en el .env
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    # los 3 brokers de rutaexpress-infra/kafka
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    consumer:
      group-id: report
      auto-offset-reset: earliest          # si el group es nuevo, lee desde el primer evento guardado
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # shipments publica el JSON como texto, sin headers de tipo: el listener lo convierte
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
