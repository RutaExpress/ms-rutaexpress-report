server:
  port: ${PORT:8086}

spring:
  application:
    name: ms-rutaexpress-report
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:reportdb}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: report
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.rutaexpress.report.dto"
        spring.json.value.default.type: com.rutaexpress.report.dto.ShipmentEventDTO